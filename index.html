<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech to Text</title>
  
</head>
<body>
  <header>
    <h1>🎙️ Real-time Speech to Text</h1>
    <p class="sub">Speak in Hindi, English, or a mix of both.</p>
  </header>

  <main>
    <section class="card">
      <div class="row">
        <button id="recBtn" class="primary">● Start recording</button>
        <span id="status" class="status">Idle</span>
      </div>
      <div id="live" class="live" aria-live="polite">Your transcription will appear here as you speak…</div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>Transcription history</h2>
        <div class="row">
          <input id="search" type="search" placeholder="Search…">
          <button id="addBtn">+ Add manually</button>
        </div>
      </div>
      <div id="empty" class="empty hidden">No transcriptions yet.</div>
      <table id="table">
        <thead><tr><th>#</th><th>Text</th><th>Created</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3 id="dlgTitle">Edit transcription</h3>
      <textarea id="dlgText" rows="6" required></textarea>
      <div class="row end">
        <button value="cancel" type="button" id="dlgCancel">Cancel</button>
        <button value="ok" class="primary" id="dlgSave">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
